# nano-hep 89M DDP — REAL apples-to-apples with HEP4M pflow_gold (content+pos AR,
# no truth-pos oracle). 4 nodes × 4 A100-80GB = 16 GPUs.
#
# Per-element token width = num_q_content + num_q_pos = 6. Each output particle
# emits 3 content tokens (VQ codes q0/q1/q2) then 3 pos tokens (PosTokenizer
# q0/q1/q2 for eta/cos_phi/sin_phi). Block grew from 320 → 512 to fit inputs
# (~60 trk + ~10 topo elements × 6 tokens) + ~8 truthpart elements × 6 + pad.
#
# Batch accounting (2026-04-21 18:xx revision — memory-probed):
#   Per-device batch 256 (probed, ~81% reserved on A100-80GB), world size 16
#   → effective batch 4096 events/step. 89M / 4096 ≈ 22k steps/epoch.
#   Prior setting was bs=64 (only 25% GPU mem used — 4× throughput left on
#   table). See feedback_gpu_mem_profiling memory note.
data:
  tokenized_root: /global/cfs/cdirs/m4958/data/COCOA/Tokenized_89M
  input_modalities: [track, topo]
  output_modality: truthpart
  num_quantizers: 3
  block_size: 512
  max_train_events: -1      # use all ~89M
  max_val_events: 10000     # match HEP4M's reduce_ds_val; bigger val set for stable metric

model:
  # Keep 90M scale for apples-to-apples parameter count with the overnight run
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  bias: false

lr:
  # Sqrt-scaled for 4× batch bump (64 → 256): 6.0e-4 × sqrt(4) = 1.2e-3.
  # Linear scaling (2.4e-3) would be too aggressive for a mid-run resume.
  peak: 1.2e-3
  floor: 1.2e-4
  warmup_steps: 500

optim:
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95

pflow_metrics:
  enabled: true
  modality_dict_path: /global/cfs/cdirs/m4958/usr/danieltm/Side_Work/FoundationModels/HEP4M/data/experiments/HEP4M-pflow-pilot/pflow_pilot_10M_nocard/modality_dict.yml

# N-head: auxiliary cardinality classifier on top of the encoder's hidden state
# at the output-modality MOD_START token. Added 2026-04-22 at step ~156k.
# On resume, train_hep.py detects a base-GPT ckpt (no n_head_mlp weights),
# does strict=False load for the base, builds optimizer base-only to match
# old state, then appends the fresh N-head params as new optimizer groups.
n_head:
  enabled: true
  max_n: 20
  loss_weight: 0.1

training:
  seed: 42
  batch_size: 256          # memory-probed 2026-04-21: ~81% A100-80GB reserved at block_size=512 (see scripts/probe_batch_memory.py)
  max_steps: 500000
  log_every: 100
  val_every: 5000      # 2026-04-23: bumped 2000 → 5000 to reclaim 2.5× step-rate slowdown from 1024-event AR eval × 3 modes (free/floor/force). At ~2800 steps/hr that's ~1h45 between vals.
  ckpt_every: 10000
  grad_clip: 1.0
  num_workers: 4
  compile: false
  bf16: true
  ar_eval_events: 1024   # 2026-04-22: bumped from 256 → 1024 to cut val SE 3.1→1.5pp and populate histograms (HEP4M uses 4096; we're 4× slower per-event on sequential AR so 1024 is the practical ceiling)
  out_dir: runs/nano_hep_89M_ddp
  wandb: true
  wandb_project: nano-hep
  run_name: nano-hep-89M-ddp-4n4g-gpos
