# nano-hep smoke config — content+pos AR (gpos extension).
# Targets the new 6-token-per-element layout on a tiny subset, verifies the
# code path runs end-to-end without errors. Does NOT aim to converge.
data:
  tokenized_root: /global/cfs/cdirs/m4958/data/COCOA/Tokenized_89M
  input_modalities: [track, topo]
  output_modality: truthpart
  num_quantizers: 3
  block_size: 512
  max_train_events: 2000
  max_val_events: 256

model:
  n_layer: 4
  n_head: 4
  n_embd: 256
  dropout: 0.0
  bias: false

lr:
  peak: 3.0e-4
  floor: 3.0e-5
  warmup_steps: 20

optim:
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95

# pflow_metrics disabled in smoke to avoid the HEP4M VQ-VAE load cost.
pflow_metrics:
  enabled: false

training:
  seed: 42
  batch_size: 16
  max_steps: 100
  log_every: 10
  val_every: 50
  ckpt_every: 100
  grad_clip: 1.0
  num_workers: 2
  compile: false
  bf16: true
  ar_eval_events: 32
  out_dir: runs/smoke_gpos
  wandb: false
  wandb_project: nano-hep
  run_name: smoke-gpos
